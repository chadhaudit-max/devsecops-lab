#cloud-config
# cloud-init.yaml
# This script runs automatically when the VM first boots
# It installs Docker and starts DefectDojo automatically

package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git

runcmd:
  # Install Docker
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker azureuser

  # Install Docker Compose
  - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
  - chmod +x /usr/local/bin/docker-compose

  # Clone and start DefectDojo
  - git clone https://github.com/DefectDojo/django-DefectDojo.git /opt/defectdojo
  - cd /opt/defectdojo && docker compose up -d

  # Save admin password to a file for retrieval
  - sleep 120 && cd /opt/defectdojo && docker compose logs initializer 2>&1 | grep "Admin password" > /home/azureuser/defectdojo-password.txt
  - chown azureuser:azureuser /home/azureuser/defectdojo-password.txt
